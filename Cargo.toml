[workspace]
resolver = "3"
members = [
    "crates/citro-core",
    "crates/citro",
    "crates/citro-install",
    "crates/citro-hub",
    "crates/citro-gui",
    "crates/citro-sync",
]

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/afftroen/Citroenition"

[profile.release]
lto = "thin"
strip = true

# Debug builds of the installer must not crawl: unpacking a 120 MB .tar.xz and hashing it are CPU-bound, and an
# unoptimised decoder needs ~90 s for what takes a few seconds optimised.
[profile.dev.package.lzma-rust2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
