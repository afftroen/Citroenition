[package]
name = "citro-gui"
description = "Citroenition desktop app (egui): profile manager GUI in pure Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "citro_gui"
path = "src/lib.rs"

[[bin]]
name = "citro-gui"
path = "src/main.rs"

[dependencies]
citro-core = { version = "0.1.0", path = "../citro-core" }
# The team layer: a team profile opens only with the hub's lock, closing uploads its data (same code as the CLI).
citro-sync = { version = "0.1.0", path = "../citro-sync" }
citro-hub = { version = "0.1.0", path = "../citro-hub" }
citro-install = { version = "0.1.0", path = "../citro-install" }
# Pure-Rust GUI stack: glow (OpenGL) renderer, X11 windowing, bundled fonts. No gtk, no system file dialogs.
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "default_fonts", "clipboard"] }
egui_extras = { version = "0.37", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Only used by the `--screenshot` developer harness.
png = "0.18"
