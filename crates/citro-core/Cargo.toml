[package]
name = "citro-core"
description = "Profile store, fingerprint model and kernel launcher for Citroenition (an AdsPower-compatible anti-detect profile manager in Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2.191"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# MACs of protected browser preferences (browser_prefs)
sha2 = "0.10"
thiserror = "2.0.21"
