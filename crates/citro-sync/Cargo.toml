[package]
name = "citro-sync"
description = "Citroenition team sync: takes the hub's lock before a profile opens, moves its cookies and data to and from the hub, keeps the lease alive and hands the profile back on close"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "citro_sync"
path = "src/lib.rs"

[dependencies]
citro-core = { version = "0.1.0", path = "../citro-core" }
citro-hub = { version = "0.1.0", path = "../citro-hub" }
flate2 = "1.1.11"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
